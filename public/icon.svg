<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner NFC / Waves Graphic -->
  <g transform="translate(256, 210)" filter="url(#glow)">
    <!-- NFC wave arcs -->
    <path d="M -90 -40 A 110 110 0 0 1 90 -40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="14" stroke-linecap="round"/>
    <path d="M -60 -15 A 75 75 0 0 1 60 -15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="14" stroke-linecap="round"/>
    <path d="M -30 10 A 40 40 0 0 1 30 10" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

    <!-- Central Glowing Star (Google Review) -->
    <path d="M 0 35 L 12 70 L 49 70 L 19 92 L 31 127 L 0 105 L -31 127 L -19 92 L -49 70 L -12 70 Z" fill="url(#starGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- QR Symbol Corner Accents at bottom -->
  <g transform="translate(180, 390)" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-60" y="-20" width="36" height="36" rx="8" stroke="#ffffff" stroke-width="6"/>
    <rect x="-48" y="-8" width="12" height="12" rx="2" fill="#ffffff"/>

    <rect x="84" y="-20" width="36" height="36" rx="8" stroke="#ffffff" stroke-width="6"/>
    <rect x="96" y="-8" width="12" height="12" rx="2" fill="#ffffff"/>
  </g>
</svg>
